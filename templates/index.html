<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HiTO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --border-hover: #cbd5e1;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
            --shadow-md: 0 10px 15px -3px rgba(0, 0, 0, 0.05), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(181deg,rgba(2, 0, 36, 1) 0%, rgba(9, 9, 121, 1) 100%, rgba(0, 212, 255, 1) 68%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 540px;
            background: var(--card-bg);
            padding: 36px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
        }

        h2 {
            font-size: 1.5rem;
            font-weight: 700;
            text-align: center;
            color: var(--text-main);
            margin-bottom: 24px;
            letter-spacing: -0.025em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 500;
            font-size: 0.875rem;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        /* Modern Custom File Upload */
        input[type="file"] {
            width: 100%;
            padding: 12px;
            background-color: var(--bg-color);
            border: 2px dashed var(--border-color);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.875rem;
            color: var(--text-muted);
            transition: all 0.2s ease;
        }

        input[type="file"]:hover {
            border-color: var(--primary);
            background-color: #eff6ff;
        }

        input[type="file"]::file-selector-button {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 6px 12px;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.85rem;
            cursor: pointer;
            margin-right: 12px;
            transition: border-color 0.2s ease;
        }

        input[type="file"]::file-selector-button:hover {
            border-color: var(--border-hover);
        }

        /* Standard Text Inputs */
        input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            font-size: 0.95rem;
            font-family: inherit;
            color: var(--text-main);
            background-color: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            box-shadow: var(--shadow-sm);
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input[type="text"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        input[type="text"]::placeholder {
            color: var(--text-muted);
            opacity: 0.6;
        }

        button {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: inherit;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: var(--shadow-sm);
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:active {
            transform: translateY(1px);
        }

        #fields-container {
            margin-top: 20px;
        }

        hr {
            border: none;
            border-top: 1px solid var(--border-color);
            margin: 24px 0;
        }
    </style>
    <!-- <link rel="stylesheet" href="/static/style.css"> -->
</head>
<body>
    <div class="container">
        <h2>HiTO (Highlight in, Text Out)</h2>
        
        <div class="form-group">
            <label for="doc-file">Select Word Document (.docx):</label>
            <input type="file" id="doc-file" accept=".docx">
        </div>

        <form id="edit-form" style="display: none;">
            <div id="fields-container"></div>
            
            <hr>

            <!-- Rename Output File Field -->
            <div class="form-group">
                <label for="custom-filename">Save Downloaded File As:</label>
                <input type="text" id="custom-filename" placeholder="ripped_document_01" value="ripped_document_01">
            </div>

            <button type="submit">Download Updated Word Document</button>
        </form>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
